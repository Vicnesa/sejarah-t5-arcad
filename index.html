<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101936"><title>Misi Jaguh Sejarah 3.0 | OS UMA DEVI</title><link rel="stylesheet" href="style.css"></head><body><header><h1>🏰 MISI JAGUH SEJARAH 3.0</h1><p>🗺️ Pengembaraan ilmu • ⭐ Artifak • 👹 BOS • 🏆 Skor</p></header><main><section id="home" class="card"><h2>🎮 Mulakan Pengembaraan</h2><label>Nama murid <input id="name" maxlength="35" placeholder="Nama murid"></label><h3>Pilih bab (🔒 dibuka selepas menang BOS)</h3><div id="levels" class="levels"></div><button id="scoresBtn">🏆 Papan Skor</button></section><section id="game" class="card hidden"><div class="stats"><span id="chapter"></span><span id="score"></span><span id="lives"></span><span id="stars"></span></div><p id="status" role="status"></p><canvas id="map" width="720" height="420" aria-label="Peta permainan. Gerak menggunakan butang arah atau papan kekunci"></canvas><div class="controls"><button data-dir="0,-1">⬆️</button><div><button data-dir="-1,0">⬅️</button><button data-dir="0,1">⬇️</button><button data-dir="1,0">➡️</button></div></div><button id="exit">🏠 Menu Utama</button></section><section id="board" class="card hidden"><h2>🏆 Papan Skor (peranti ini)</h2><div id="scores"></div><button id="csv">📊 Eksport CSV</button><button id="back">🏠 Kembali</button></section></main><div id="overlay" class="overlay hidden"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="qtitle"><h2 id="qtitle"></h2><p id="qtext"></p><div id="answers"></div><p id="feedback" role="status"></p><p id="timer"></p><button id="continue" class="hidden">Teruskan ➡️</button></div></div><footer>© OS UMA DEVI — Hak Cipta Terpelihara<br><small>Latihan pendidikan; rekod disimpan pada peranti ini sahaja.</small></footer><script src="data.js"></script><script src="app.js"></script></body></html>
